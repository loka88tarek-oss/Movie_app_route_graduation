name: movies_app
description: "A Flutter Movies App with Clean Architecture."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.7.0

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # Firebase
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  google_sign_in: ^6.2.1
  cloud_firestore: ^5.6.12

  # State Management
  flutter_bloc: ^9.1.1
  equatable: ^2.0.5
  stream_transform: ^2.1.2
  bloc_concurrency: ^0.3.0

  # Local Storage
  shared_preferences: ^2.3.2
  hive: ^2.2.3
  hive_flutter: ^1.1.0

  # Navigation
  go_router: ^14.3.0

  # Network (for teammates' TMDB usage)
  dio: ^5.11.1
  dartz: ^0.10.1

  # UI / UX
  smooth_page_indicator: ^1.2.0
  cached_network_image: ^3.4.1
  image_picker: ^1.1.2
  flutter_screenutil: ^5.9.3
  flutter_svg: ^2.3.0
  url_launcher: ^6.3.2

  # Utils
  connectivity_plus: ^6.0.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  build_runner: ^2.4.13
  hive_generator: ^2.0.1
  flutter_gen_runner: ^5.8.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/